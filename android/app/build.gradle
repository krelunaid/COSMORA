apply plugin: 'com.android.application'

// Meta client token is not committed. Release builds read it from, in order:
// FACEBOOK_CLIENT_TOKEN, android/facebook-client-token.properties, or
// facebook.client.token in android/local.properties.
def metaClientToken = (System.getenv("FACEBOOK_CLIENT_TOKEN") ?: "").trim()
if (!metaClientToken) {
    def metaTokenFile = rootProject.file("facebook-client-token.properties")
    if (metaTokenFile.exists()) {
        def metaTokenProps = new Properties()
        metaTokenFile.withInputStream { metaTokenProps.load(it) }
        metaClientToken = (metaTokenProps.getProperty("FACEBOOK_CLIENT_TOKEN") ?: "").trim()
    }
}
if (!metaClientToken) {
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        def localProps = new Properties()
        localPropsFile.withInputStream { localProps.load(it) }
        metaClientToken = (localProps.getProperty("facebook.client.token") ?: "").trim()
    }
}

def metaClientTokenConfigured = (metaClientToken ==~ /^[A-Za-z0-9_-]{16,}$/) &&
    !metaClientToken.startsWith("REPLACE") &&
    !metaClientToken.startsWith("YOUR_")

android {
    namespace = "it.kreluna.cosmora"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Play / Meta package. Capacitor appId stays it.kreluna.cosmora for the iOS bundle.
        applicationId "com.kreluna.cosmora"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "1.0"
        resValue "string", "facebook_client_token", metaClientTokenConfigured ? metaClientToken : ""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.facebook.android:facebook-core:19.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

afterEvaluate {
    tasks.matching { it.name == "preReleaseBuild" }.configureEach {
        doFirst {
            if (!metaClientTokenConfigured) {
                throw new GradleException(
                    "Meta App Events: release build blocked. Set FACEBOOK_CLIENT_TOKEN, " +
                    "android/facebook-client-token.properties, or facebook.client.token in " +
                    "android/local.properties. Copy the client token from Meta app " +
                    "1609311830149459 > App settings > Advanced. Do not commit it."
                )
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
